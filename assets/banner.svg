  <rect x="122" y="298" width="80" height="24" fill="none" stroke="#0A66C2" stroke-width="1" stroke-opacity="0.2">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.4s" begin="1.4s" repeatCount="indefinite"/>
  </rect>
  <text x="162" y="314" class="mono" font-size="11" fill="#A9A9A9" text-anchor="middle">Streamlit</text>

  <rect x="212" y="298" width="62" height="24" fill="#0F0F0F" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="212" y="298" width="62" height="24" fill="none" stroke="#0A66C2" stroke-width="1" stroke-opacity="0.2">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.4s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="243" y="314" class="mono" font-size="11" fill="#A9A9A9" text-anchor="middle">Gradio</text>

  <rect x="284" y="298" width="62" height="24" fill="#0F0F0F" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="284" y="298" width="62" height="24" fill="none" stroke="#0A66C2" stroke-width="1" stroke-opacity="0.2">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.4s" begin="1.8s" repeatCount="indefinite"/>
  </rect>
  <text x="315" y="314" class="mono" font-size="11" fill="#A9A9A9" text-anchor="middle">Ollama</text>

  <rect x="356" y="298" width="76" height="24" fill="#0F0F0F" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="356" y="298" width="76" height="24" fill="none" stroke="#0A66C2" stroke-width="1" stroke-opacity="0.2">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.4s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <text x="394" y="314" class="mono" font-size="11" fill="#A9A9A9" text-anchor="middle">Power BI</text>

  <!-- right side: pipeline as vertical steps -->
