<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-label="Dannial Ahmad — Profile Dashboard">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
    </style>
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A66C2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E8FA03" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0A66C2" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="stripClip"><rect x="0" y="0" width="940" height="4"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="940" height="360" fill="#0A0A0A"/>

  <!-- Top header strip (reference signature) with slow light sweep -->
  <rect x="0" y="0" width="940" height="3" fill="#0A66C2"/>
  <rect x="0" y="3" width="940" height="1" fill="#E8FA03"/>
  <g clip-path="url(#stripClip)">
    <rect x="-160" y="0" width="160" height="3" fill="url(#sweepGrad)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 1100 0" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══ IDENTITY ══ -->
  <text x="24" y="36" class="mono" font-size="10" font-weight="700" fill="#0A66C2" letter-spacing="2">IDENTITY</text>
  <line x1="24" y1="44" x2="916" y2="44" stroke="#1A1A1A" stroke-width="1"/>

  <rect x="24" y="56" width="64" height="64" fill="#0A66C2"/>
  <text x="56" y="98" class="mono" font-size="24" font-weight="700" fill="#0A0A0A" text-anchor="middle">DA</text>

  <text x="104" y="82" class="mono" font-size="18" font-weight="700" fill="#FFFFFF">Dannial Ahmad</text>
  <text x="104" y="100" class="mono" font-size="12" fill="#0A66C2">@dannial-ahmad</text>
  <text x="104" y="118" class="mono" font-size="11" fill="#A9A9A9">AI / ML Engineer · Data Scientist · Intelligent Systems</text>

  <!-- right meta -->
  <text x="916" y="82" class="mono" font-size="10" fill="#A9A9A9" text-anchor="end">Joined Feb 2026</text>
  <circle cx="828" cy="101" r="3" fill="#E8FA03">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="838" y="105" class="mono" font-size="10" font-weight="700" fill="#E8FA03" letter-spacing="1">ACTIVE</text>

  <!-- ══ TERMINAL ══ -->
  <text x="24" y="156" class="mono" font-size="10" font-weight="700" fill="#0A66C2" letter-spacing="2">TERMINAL</text>
  <line x1="24" y1="164" x2="916" y2="164" stroke="#1A1A1A" stroke-width="1"/>

  <text x="24" y="188" class="mono" font-size="13" fill="#5A5A5A">$ whoami</text>
  <text x="118" y="188" class="mono" font-size="13" fill="#FFFFFF">→ ml-engineer-in-the-making</text>
  <rect x="346" y="176" width="8" height="15" fill="#E8FA03">
    <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="24" y="212" class="mono" font-size="13" fill="#5A5A5A">$ cat focus.txt</text>
  <text x="178" y="212" class="mono" font-size="13" fill="#0A66C2">→ deep-learning · system-design · real-impact</text>

  <!-- ══ STACK ══ -->
  <text x="24" y="244" class="mono" font-size="10" font-weight="700" fill="#0A66C2" letter-spacing="2">STACK</text>
  <line x1="24" y1="252" x2="916" y2="252" stroke="#1A1A1A" stroke-width="1"/>

