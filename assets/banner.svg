    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.4s" begin="0.6s" repeatCount="indefinite"/>
  </rect>
  <text x="302" y="280" class="mono" font-size="11" fill="#A9A9A9" text-anchor="middle">TensorFlow</text>

  <rect x="356" y="264" width="68" height="24" fill="#0F0F0F" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="356" y="264" width="68" height="24" fill="none" stroke="#0A66C2" stroke-width="1" stroke-opacity="0.2">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.4s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <text x="390" y="280" class="mono" font-size="11" fill="#A9A9A9" text-anchor="middle">Pandas</text>

