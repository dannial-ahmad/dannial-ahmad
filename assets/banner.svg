  <rect x="434" y="264" width="56" height="24" fill="none" stroke="#0A66C2" stroke-width="1" stroke-opacity="0.2">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.4s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="462" y="280" class="mono" font-size="11" fill="#A9A9A9" text-anchor="middle">NumPy</text>

