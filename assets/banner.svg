  <text x="916" y="314" class="mono" font-size="10" fill="#A9A9A9" text-anchor="end">status: open to collaborate</text>

  <!-- bottom -->
  <line x1="24" y1="340" x2="916" y2="340" stroke="#1A1A1A" stroke-width="1"/>
  <text x="916" y="352" class="mono" font-size="9" fill="#5A5A5A" text-anchor="end">dannial-ahmad · profile v4 · clean pipelines, clear thinking</text>
