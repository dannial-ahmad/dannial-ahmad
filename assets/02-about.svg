<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" font-family="Segoe UI, Verdana, Arial, sans-serif">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131A2E"/>
      <stop offset="100%" stop-color="#0E1526"/>
    </linearGradient>
    <linearGradient id="aboutLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <clipPath id="aboutClip"><rect width="958" height="228" x="1" y="1" rx="23"/></clipPath>
  </defs>

  <g clip-path="url(#aboutClip)">
    <rect width="960" height="230" fill="url(#aboutBg)"/>

    <!-- sparkles -->
    <text x="480" y="48" font-size="14" fill="#FF6B9D" opacity="0.6">✦
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="880" y="80" font-size="13" fill="#22D3EE" opacity="0.6">✧
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.1s" begin="0.7s" repeatCount="indefinite"/>
    </text>
    <text x="700" y="196" font-size="13" fill="#A78BFA" opacity="0.6">✧
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.9s" begin="1.2s" repeatCount="indefinite"/>
    </text>

    <!-- avatar with pulse rings -->
    <circle cx="110" cy="112" r="58" fill="none" stroke="#FF6B9D" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="52;72;52" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="112" r="58" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="52;72;52" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="112" r="46" fill="url(#avatarGrad)"/>
    <text x="110" y="122" font-size="30" font-weight="800" fill="#FFFFFF" text-anchor="middle">DA</text>
    <circle cx="146" cy="76" r="9" fill="#69F0AE" stroke="#0E1526" stroke-width="3">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- text -->
    <text x="210" y="78" font-size="24" font-weight="700" fill="#FF6B9D">Hey there, fellow explorer! ✧</text>
    <rect x="210" y="90" width="120" height="3" rx="1.5" fill="url(#aboutLine)">
      <animate attributeName="width" values="120;320;120" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="210" y="126" font-size="17" fill="#C9D6F2">I craft intelligent systems that turn messy data into real impact.</text>
    <text x="210" y="154" font-size="15" fill="#8B9BC4">Clean pipelines • Clear thinking • Code that feels good to maintain</text>

    <!-- mini chips -->
    <rect x="210" y="174" width="74" height="28" rx="14" fill="none" stroke="#FF6B9D" stroke-width="1.3" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.35;0.8" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="247" y="193" font-size="12.5" fill="#FF9DBB" text-anchor="middle" font-weight="600">ML</text>
    <rect x="296" y="174" width="74" height="28" rx="14" fill="none" stroke="#22D3EE" stroke-width="1.3" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.35;0.8" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <text x="333" y="193" font-size="12.5" fill="#7DD3FC" text-anchor="middle" font-weight="600">DATA</text>
    <rect x="382" y="174" width="110" height="28" rx="14" fill="none" stroke="#A78BFA" stroke-width="1.3" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0.35;0.8" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <text x="437" y="193" font-size="12.5" fill="#C4B5FD" text-anchor="middle" font-weight="600">AI SYSTEMS</text>

    <!-- loading dots -->
    <circle cx="872" cy="188" r="4" fill="#FF6B9D"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="886" cy="188" r="4" fill="#A78BFA"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="188" r="4" fill="#22D3EE"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>
  <rect width="958" height="228" x="1" y="1" rx="23" fill="none" stroke="#2A3558" stroke-width="2"/>
</svg>
