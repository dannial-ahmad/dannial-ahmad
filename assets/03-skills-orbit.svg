<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Segoe UI, Verdana, Arial, sans-serif">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C4DFF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#FF6B9D" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF6B9D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </radialGradient>
  </defs>

  <!-- ambient glow -->
  <circle cx="500" cy="235" r="240" fill="url(#coreGlow)">
    <animate attributeName="r" values="240;260;240" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- orbit guides -->
  <circle cx="500" cy="235" r="115" fill="none" stroke="#8B9BC4" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 7">
    <animate attributeName="stroke-dashoffset" values="0;44" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="235" r="195" fill="none" stroke="#8B9BC4" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 7">
    <animate attributeName="stroke-dashoffset" values="0;-44" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling stars -->
  <text x="80" y="80" font-size="16" fill="#FF6B9D" opacity="0.7">✦<animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.4s" repeatCount="indefinite"/></text>
  <text x="920" y="110" font-size="14" fill="#22D3EE" opacity="0.7">✧<animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.8s" begin="0.5s" repeatCount="indefinite"/></text>
  <text x="130" y="400" font-size="14" fill="#A78BFA" opacity="0.7">✧<animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></text>
  <text x="900" y="410" font-size="16" fill="#69F0AE" opacity="0.7">✦<animate attributeName="opacity" values="0.7;0.1;0.7" dur="3s" begin="1.4s" repeatCount="indefinite"/></text>
  <text x="500" y="24" font-size="13" fill="#8B9BC4" opacity="0.7">✧<animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.2s" begin="0.3s" repeatCount="indefinite"/></text>
  <text x="500" y="458" font-size="13" fill="#8B9BC4" opacity="0.7">✧<animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></text>

  <!-- outer orbit group (rotates clockwise) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 235" to="360 500 235" dur="45s" repeatCount="indefinite"/>
    <!-- orbiting satellite dots -->
    <circle cx="695" cy="235" r="4" fill="#FF6B9D"><animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="430" r="4" fill="#22D3EE"><animate attributeName="r" values="4;6;4" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>

    <g transform="translate(695,235)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="45s" repeatCount="indefinite"/>
      <rect x="-64" y="-17" width="128" height="34" rx="17" fill="#131A2E" stroke="#FF6B9D" stroke-width="1.5"/>
      <text y="4.5" font-size="12.5" font-weight="600" fill="#FF9DBB" text-anchor="middle">TensorFlow</text>
    </g></g>
    <g transform="translate(638,373)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="45s" repeatCount="indefinite"/>
      <rect x="-64" y="-17" width="128" height="34" rx="17" fill="#131A2E" stroke="#22D3EE" stroke-width="1.5"/>
      <text y="4.5" font-size="12.5" font-weight="600" fill="#7DD3FC" text-anchor="middle">Scikit-learn</text>
    </g></g>
    <g transform="translate(500,430)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="45s" repeatCount="indefinite"/>
      <rect x="-64" y="-17" width="128" height="34" rx="17" fill="#131A2E" stroke="#A78BFA" stroke-width="1.5"/>
      <text y="4.5" font-size="12.5" font-weight="600" fill="#C4B5FD" text-anchor="middle">NumPy</text>
    </g></g>
    <g transform="translate(362,373)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="45s" repeatCount="indefinite"/>
      <rect x="-64" y="-17" width="128" height="34" rx="17" fill="#131A2E" stroke="#69F0AE" stroke-width="1.5"/>
      <text y="4.5" font-size="12.5" font-weight="600" fill="#A7FFC7" text-anchor="middle">Streamlit</text>
    </g></g>
    <g transform="translate(305,235)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="45s" repeatCount="indefinite"/>
      <rect x="-64" y="-17" width="128" height="34" rx="17" fill="#131A2E" stroke="#FFD54F" stroke-width="1.5"/>
      <text y="4.5" font-size="12.5" font-weight="600" fill="#FFE082" text-anchor="middle">Gradio</text>
    </g></g>
    <g transform="translate(362,97)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="45s" repeatCount="indefinite"/>
      <rect x="-64" y="-17" width="128" height="34" rx="17" fill="#131A2E" stroke="#22D3EE" stroke-width="1.5"/>
      <text y="4.5" font-size="12.5" font-weight="600" fill="#7DD3FC" text-anchor="middle">Ollama</text>
    </g></g>
    <g transform="translate(500,40)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="45s" repeatCount="indefinite"/>
      <rect x="-64" y="-17" width="128" height="34" rx="17" fill="#131A2E" stroke="#FF6B9D" stroke-width="1.5"/>
      <text y="4.5" font-size="12.5" font-weight="600" fill="#FF9DBB" text-anchor="middle">Matplotlib</text>
    </g></g>
    <g transform="translate(638,97)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="45s" repeatCount="indefinite"/>
      <rect x="-64" y="-17" width="128" height="34" rx="17" fill="#131A2E" stroke="#A78BFA" stroke-width="1.5"/>
      <text y="4.5" font-size="12.5" font-weight="600" fill="#C4B5FD" text-anchor="middle">Power BI</text>
    </g></g>
  </g>

  <!-- inner orbit group (rotates counter-clockwise) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 235" to="-360 500 235" dur="32s" repeatCount="indefinite"/>
    <circle cx="581" cy="154" r="3.5" fill="#69F0AE"><animate attributeName="r" values="3.5;5.5;3.5" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="419" cy="316" r="3.5" fill="#FFD54F"><animate attributeName="r" values="3.5;5.5;3.5" dur="1.8s" begin="0.7s" repeatCount="indefinite"/></circle>

    <g transform="translate(581,154)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#1A2338" stroke="#FF6B9D" stroke-width="1.5"/>
      <text y="4.5" font-size="13" font-weight="700" fill="#FF9DBB" text-anchor="middle">ML</text>
    </g></g>
    <g transform="translate(581,316)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#1A2338" stroke="#22D3EE" stroke-width="1.5"/>
      <text y="4.5" font-size="13" font-weight="700" fill="#7DD3FC" text-anchor="middle">Python</text>
    </g></g>
    <g transform="translate(419,316)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#1A2338" stroke="#A78BFA" stroke-width="1.5"/>
      <text y="4.5" font-size="13" font-weight="700" fill="#C4B5FD" text-anchor="middle">SQL</text>
    </g></g>
    <g transform="translate(419,154)"><g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#1A2338" stroke="#69F0AE" stroke-width="1.5"/>
      <text y="4.5" font-size="13" font-weight="700" fill="#A7FFC7" text-anchor="middle">Pandas</text>
    </g></g>
  </g>

  <!-- core -->
  <circle cx="500" cy="235" r="62" fill="none" stroke="#FF6B9D" stroke-width="1.5" opacity="0.6">
    <animate attributeName="r" values="58;76;58" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="235" r="62" fill="none" stroke="#22D3EE" stroke-width="1.5" opacity="0.5">
    <animate attributeName="r" values="58;76;58" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="235" r="50" fill="url(#coreGrad)" stroke="#FF9DBB" stroke-width="2">
    <animate attributeName="stroke-width" values="2;3.5;2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="232" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">AI ✦</text>
  <text x="500" y="254" font-size="13" font-weight="600" fill="#FFE0EC" text-anchor="middle" letter-spacing="2">CORE</text>
</svg>
