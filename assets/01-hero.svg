<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" font-family="Segoe UI, Verdana, Arial, sans-serif">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E1E"/>
      <stop offset="45%" stop-color="#141233"/>
      <stop offset="100%" stop-color="#0D1B2E"/>
    </linearGradient>
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="230" y1="0" x2="870" y2="0">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 320 0; 0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF6B9D" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6B9D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#8B9BC4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="heroClip"><rect width="1100" height="330" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect width="1100" height="330" fill="url(#heroBg)"/>
    <rect width="1100" height="330" fill="url(#grid)"/>
    <circle cx="170" cy="90" r="180" fill="url(#glowPink)"/>
    <circle cx="930" cy="240" r="200" fill="url(#glowCyan)"/>
    <circle cx="700" cy="40" r="150" fill="url(#glowViolet)"/>

    <!-- floating particles -->
    <circle cx="130" cy="250" r="3" fill="#FF6B9D" opacity="0.8">
      <animate attributeName="cy" values="250;230;250" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="70" r="2.5" fill="#22D3EE" opacity="0.8">
      <animate attributeName="cy" values="70;55;70" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="3.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="290" r="2.5" fill="#A78BFA" opacity="0.8">
      <animate attributeName="cy" values="290;272;290" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="60" r="3" fill="#69F0AE" opacity="0.7">
      <animate attributeName="cy" values="60;45;60" dur="4.6s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.6s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="90" r="2.5" fill="#FF6B9D" opacity="0.8">
      <animate attributeName="cy" values="90;75;90" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="180" r="3" fill="#22D3EE" opacity="0.8">
      <animate attributeName="cy" values="180;162;180" dur="4s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.15;0.8" dur="4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="180" r="2" fill="#E6EDF3" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2.8s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="200" r="2" fill="#E6EDF3" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.2s" begin="1.3s" repeatCount="indefinite"/>
    </circle>

    <!-- shooting comet -->
    <circle r="3.5" fill="#FFFFFF">
      <animateMotion path="M 60 60 Q 320 130 560 110 T 1040 40" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.8;1" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="8" fill="#FF6B9D" opacity="0.35">
      <animateMotion path="M 60 60 Q 320 130 560 110 T 1040 40" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0" keyTimes="0;0.1;0.8;1" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- corner brackets -->
    <path d="M22 44 V22 H44" fill="none" stroke="#22D3EE" stroke-width="2.5" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M1078 44 V22 H1056" fill="none" stroke="#FF6B9D" stroke-width="2.5" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </path>
    <path d="M22 286 V308 H44" fill="none" stroke="#A78BFA" stroke-width="2.5" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M1078 286 V308 H1056" fill="none" stroke="#69F0AE" stroke-width="2.5" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0.25;0.7" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </path>

    <!-- status chip -->
    <rect x="856" y="38" width="212" height="34" rx="17" fill="#0B0E1E" stroke="#2A3558" stroke-width="1.5"/>
    <circle cx="880" cy="55" r="5" fill="#69F0AE">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="895" y="60" font-size="13" fill="#B8C7E6" font-weight="600">OPEN TO COLLABORATE</text>

    <!-- name block -->
    <text x="550" y="118" font-size="17" fill="#8B9BC4" text-anchor="middle" letter-spacing="10" opacity="0.9">ダニアル・アフマド
      <animate attributeName="opacity" values="0.9;0.45;0.9" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="552" y="182" font-size="62" font-weight="800" text-anchor="middle" fill="#A78BFA" opacity="0.28" letter-spacing="4">DANNIAL AHMAD</text>
    <text x="550" y="180" font-size="62" font-weight="800" text-anchor="middle" fill="url(#nameGrad)" letter-spacing="4">DANNIAL AHMAD</text>

    <rect x="400" y="202" width="300" height="3" rx="1.5" fill="#2A3558"/>
    <rect x="400" y="202" width="300" height="3" rx="1.5" fill="url(#nameGrad)">
      <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.4;0.8;1" dur="5s" repeatCount="indefinite"/>
    </rect>

    <text x="550" y="240" font-size="20" fill="#B8C7E6" text-anchor="middle">✦ Machine Learning Engineer ✦ Data Scientist ✦ Intelligent Systems ✦</text>
    <text x="550" y="272" font-size="15" fill="#7E8FB3" text-anchor="middle">building cute &amp; powerful AI solutions, one pipeline at a time</text>

    <!-- bottom waves -->
    <g clip-path="url(#heroClip)">
      <g opacity="0.5">
        <path d="M0 300 Q 137 285 275 300 T 550 300 T 825 300 T 1100 300 V330 H0 Z" fill="#FF6B9D" opacity="0.12"/>
        <path d="M0 310 Q 137 295 275 310 T 550 310 T 825 310 T 1100 310 V330 H0 Z" fill="#22D3EE" opacity="0.12"/>
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; -275 0" dur="6s" repeatCount="indefinite"/>
          <path d="M0 300 Q 137 285 275 300 T 550 300 T 825 300 T 1100 300 T 1375 300 V330 H0 Z" fill="#FF6B9D" opacity="0.10"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="translate" values="-275 0; 0 0" dur="8s" repeatCount="indefinite"/>
          <path d="M0 312 Q 137 298 275 312 T 550 312 T 825 312 T 1100 312 T 1375 312 V330 H0 Z" fill="#22D3EE" opacity="0.10"/>
        </g>
      </g>
    </g>
  </g>
  <rect width="1098" height="328" x="1" y="1" rx="21" fill="none" stroke="#2A3558" stroke-width="2"/>
</svg>
