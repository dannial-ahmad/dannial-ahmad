<svg xmlns="http://www.w3.org/2000/svg" width="960" height="200" viewBox="0 0 960 200" font-family="Segoe UI, Verdana, Arial, sans-serif">
  <defs>
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141C31"/>
      <stop offset="100%" stop-color="#0E1526"/>
    </linearGradient>
  </defs>

  <!-- pill 1: Deep Learning -->
  <g>
    <rect x="40" y="34" width="880" height="42" rx="21" fill="url(#pillBg)" stroke="#FF6B9D" stroke-width="1.5" stroke-opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="72" y="61" font-size="17">🧠</text>
    <text x="104" y="61" font-size="15" font-weight="700" fill="#E6EDF3">Deep Learning</text>
    <line x1="480" y1="55" x2="800" y2="55" stroke="#FF6B9D" stroke-width="3" stroke-linecap="round" stroke-dasharray="26 34" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;120" dur="3s" repeatCount="indefinite"/>
    </line>
    <text x="838" y="61" font-size="11" fill="#7E8FB3">in progress</text>
    <circle cx="896" cy="55" r="3.5" fill="#FF6B9D"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="908" cy="55" r="3.5" fill="#FF6B9D"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>

  <!-- pill 2: ML System Design -->
  <g>
    <rect x="40" y="92" width="880" height="42" rx="21" fill="url(#pillBg)" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" begin="0.7s" repeatCount="indefinite"/>
    </rect>
    <text x="72" y="119" font-size="17">⚙️</text>
    <text x="104" y="119" font-size="15" font-weight="700" fill="#E6EDF3">ML System Design</text>
    <line x1="480" y1="113" x2="800" y2="113" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-dasharray="26 34" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;120" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <text x="838" y="119" font-size="11" fill="#7E8FB3">in progress</text>
    <circle cx="896" cy="113" r="3.5" fill="#22D3EE"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="0.15s" repeatCount="indefinite"/></circle>
    <circle cx="908" cy="113" r="3.5" fill="#22D3EE"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="0.45s" repeatCount="indefinite"/></circle>
  </g>

  <!-- pill 3: Real-world Impact -->
  <g>
    <rect x="40" y="150" width="880" height="42" rx="21" fill="url(#pillBg)" stroke="#69F0AE" stroke-width="1.5" stroke-opacity="0.6">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" begin="1.4s" repeatCount="indefinite"/>
    </rect>
    <text x="72" y="177" font-size="17">🌍</text>
    <text x="104" y="177" font-size="15" font-weight="700" fill="#E6EDF3">Real-world Impact</text>
    <line x1="480" y1="171" x2="800" y2="171" stroke="#69F0AE" stroke-width="3" stroke-linecap="round" stroke-dasharray="26 34" opacity="0.5">
      <animate attributeName="stroke-dashoffset" values="0;120" dur="3s" begin="1s" repeatCount="indefinite"/>
    </line>
    <text x="838" y="177" font-size="11" fill="#7E8FB3">in progress</text>
    <circle cx="896" cy="171" r="3.5" fill="#69F0AE"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="908" cy="171" r="3.5" fill="#69F0AE"><animate attributeName="opacity" values="0.15;1;0.15" dur="1.2s" begin="0.6s" repeatCount="indefinite"/></circle>
  </g>
</svg>
