<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" font-family="Segoe UI, Verdana, Arial, sans-serif">
  <defs>
    <linearGradient id="connBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131A2E"/>
      <stop offset="100%" stop-color="#0D1424"/>
    </linearGradient>
    <linearGradient id="connGrad" gradientUnits="userSpaceOnUse" x1="180" y1="0" x2="780" y2="0">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 260 0; 0 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="connClip"><rect width="958" height="178" x="1" y="1" rx="23"/></clipPath>
  </defs>

  <g clip-path="url(#connClip)">
    <rect width="960" height="180" fill="url(#connBg)"/>

    <text x="80" y="52" font-size="14" fill="#FF6B9D" opacity="0.7">✦<animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.4s" repeatCount="indefinite"/></text>
    <text x="880" y="60" font-size="14" fill="#22D3EE" opacity="0.7">✧<animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.9s" begin="0.7s" repeatCount="indefinite"/></text>
    <text x="140" y="150" font-size="12" fill="#A78BFA" opacity="0.7">✧<animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.6s" begin="1.3s" repeatCount="indefinite"/></text>
    <text x="830" y="148" font-size="12" fill="#69F0AE" opacity="0.7">✦<animate attributeName="opacity" values="0.7;0.1;0.7" dur="3.1s" begin="0.4s" repeatCount="indefinite"/></text>

    <text x="480" y="62" font-size="22" font-weight="800" text-anchor="middle" fill="url(#connGrad)" letter-spacing="1">LET'S BUILD SOMETHING INTELLIGENT ✧</text>
    <text x="480" y="88" font-size="13.5" fill="#8B9BC4" text-anchor="middle">Open to collaborations • data chats • cute dashboards</text>

    <!-- LinkedIn button -->
    <a href="https://linkedin.com/in/dannialahmad">
      <rect x="290" y="110" width="170" height="42" rx="21" fill="#131A2E" stroke="#FF6B9D" stroke-width="1.8">
        <animate attributeName="stroke-width" values="1.8;3;1.8" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="375" y="136" font-size="14" font-weight="700" fill="#FF9DBB" text-anchor="middle">in / dannialahmad</text>
    </a>
    <!-- GitHub button -->
    <a href="https://github.com/dannial-ahmad">
      <rect x="500" y="110" width="170" height="42" rx="21" fill="#131A2E" stroke="#A78BFA" stroke-width="1.8">
        <animate attributeName="stroke-width" values="1.8;3;1.8" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      </rect>
      <text x="585" y="136" font-size="14" font-weight="700" fill="#C4B5FD" text-anchor="middle">ⓘ @dannial-ahmad</text>
    </a>

    <!-- sparkle between buttons -->
    <text x="480" y="136" font-size="14" fill="#FFD54F" text-anchor="middle">✧
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect width="958" height="178" x="1" y="1" rx="23" fill="none" stroke="#2A3558" stroke-width="2"/>
</svg>
