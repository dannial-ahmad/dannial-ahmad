<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="54" viewBox="0 0 1100 54" font-family="Segoe UI, Verdana, Arial, sans-serif">
  <!-- marching dashed lines -->
  <line x1="250" y1="27" x2="470" y2="27" stroke="#FF6B9D" stroke-width="2" stroke-dasharray="8 10" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;36" dur="1.6s" repeatCount="indefinite"/>
  </line>
  <line x1="630" y1="27" x2="850" y2="27" stroke="#22D3EE" stroke-width="2" stroke-dasharray="8 10" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-36" dur="1.6s" repeatCount="indefinite"/>
  </line>

  <!-- center star -->
  <text x="550" y="33" font-size="18" fill="#A78BFA" text-anchor="middle">✦
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="font-size" values="18;22;18" dur="2.2s" repeatCount="indefinite"/>
  </text>

  <!-- side stars -->
  <text x="486" y="32" font-size="12" fill="#FF9DBB" text-anchor="middle">✧
    <animate attributeName="opacity" values="0.8;0.15;0.8" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
  </text>
  <text x="614" y="32" font-size="12" fill="#7DD3FC" text-anchor="middle">✧
    <animate attributeName="opacity" values="0.8;0.15;0.8" dur="1.8s" begin="1.1s" repeatCount="indefinite"/>
  </text>
</svg>
