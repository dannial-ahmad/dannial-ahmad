<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="170" viewBox="0 0 1100 170" font-family="Segoe UI, Verdana, Arial, sans-serif">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131A2E"/>
      <stop offset="55%" stop-color="#101428"/>
      <stop offset="100%" stop-color="#0D1B2E"/>
    </linearGradient>
    <linearGradient id="footGradText" gradientUnits="userSpaceOnUse" x1="250" y1="0" x2="850" y2="0">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 240 0; 0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="footClip"><rect width="1098" height="168" x="1" y="1" rx="23"/></clipPath>
  </defs>

  <g clip-path="url(#footClip)">
    <rect width="1100" height="170" fill="url(#footGrad)"/>

    <!-- floating emoji sparkles -->
    <text x="120" y="52" font-size="20" opacity="0.85" fill="#FF6B9D">♡
      <animate attributeName="y" values="52;38;52" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.85;0.3;0.85" dur="2.8s" repeatCount="indefinite"/>
    </text>
    <text x="960" y="58" font-size="18" opacity="0.8" fill="#FFD54F">★
      <animate attributeName="y" values="58;44;58" dur="3.2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.2s" begin="0.5s" repeatCount="indefinite"/>
    </text>
    <text x="200" y="112" font-size="16" opacity="0.7" fill="#A78BFA">✦
      <animate attributeName="y" values="112;100;112" dur="2.5s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" begin="0.9s" repeatCount="indefinite"/>
    </text>
    <text x="880" y="106" font-size="16" opacity="0.7" fill="#22D3EE">✧
      <animate attributeName="y" values="106;94;106" dur="2.9s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.9s" begin="1.3s" repeatCount="indefinite"/>
    </text>

    <text x="550" y="64" font-size="23" font-weight="800" text-anchor="middle" fill="url(#footGradText)">Thanks for visiting! Star ⭐ &amp; let's build something cool</text>
    <text x="550" y="94" font-size="14" fill="#8B9BC4" text-anchor="middle">Cute code • Real impact • Always learning</text>

    <!-- animated waves -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -275 0" dur="7s" repeatCount="indefinite"/>
      <path d="M0 132 Q 137 118 275 132 T 550 132 T 825 132 T 1100 132 T 1375 132 V170 H0 Z" fill="#FF6B9D" opacity="0.14"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="-275 0; 0 0" dur="9s" repeatCount="indefinite"/>
      <path d="M0 142 Q 137 128 275 142 T 550 142 T 825 142 T 1100 142 T 1375 142 V170 H0 Z" fill="#22D3EE" opacity="0.14"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -275 0" dur="11s" repeatCount="indefinite"/>
      <path d="M0 152 Q 137 140 275 152 T 550 152 T 825 152 T 1100 152 T 1375 152 V170 H0 Z" fill="#A78BFA" opacity="0.16"/>
    </g>
  </g>
  <rect width="1098" height="168" x="1" y="1" rx="23" fill="none" stroke="#2A3558" stroke-width="2"/>
</svg>
