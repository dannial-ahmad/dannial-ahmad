="9.5" font-weight="400" fill="#6E7681" letter-spacing="1" text-anchor="middle">FIRST PUBLIC REPOS</text><text x="56" y="208" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="400" fill="#6E7681" letter-spacing="1.5" text-anchor="start">EARLY LOGS ARE SHORT. THAT IS WHAT A BEGINNING LOOKS LIKE.</text><filter id="vig" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0"/></filter><rect width="1200" height="240" filter="url(#grain)" opacity="0.09"/><rect width="1200" height="240" fill="url(#vigGrad)" opacity="0.5"/></svg>