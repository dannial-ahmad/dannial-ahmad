<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" font-family="Segoe UI, Verdana, Arial, sans-serif">
  <defs>
    <linearGradient id="cardBg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141C31"/>
      <stop offset="100%" stop-color="#0E1526"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cA"><rect x="15" y="45" width="216" height="180" rx="18"/></clipPath>
    <clipPath id="cB"><rect x="253" y="45" width="216" height="180" rx="18"/></clipPath>
    <clipPath id="cC"><rect x="491" y="45" width="216" height="180" rx="18"/></clipPath>
    <clipPath id="cD"><rect x="729" y="45" width="216" height="180" rx="18"/></clipPath>
  </defs>

  <!-- card 1: Communication -->
  <g>
    <rect x="15" y="45" width="216" height="180" rx="18" fill="url(#cardBg5)" stroke="#FF6B9D" stroke-width="1.6" stroke-opacity="0.55">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="15" y="45" width="216" height="4" rx="2" fill="#FF6B9D"/>
    <g clip-path="url(#cA)">
      <rect x="-80" y="45" width="70" height="180" fill="url(#sweep)" transform="skewX(-18)">
        <animate attributeName="x" values="-80;320" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="123" y="102" font-size="27" text-anchor="middle">💬</text>
    <text x="123" y="138" font-size="16" font-weight="700" fill="#FF9DBB" text-anchor="middle">Communication</text>
    <text x="123" y="163" font-size="12.5" fill="#B8C7E6" text-anchor="middle">Clear &amp; friendly</text>
    <text x="123" y="181" font-size="12.5" fill="#B8C7E6" text-anchor="middle">explanations</text>
  </g>

  <!-- card 2: Problem Solving -->
  <g>
    <rect x="253" y="45" width="216" height="180" rx="18" fill="url(#cardBg5)" stroke="#22D3EE" stroke-width="1.6" stroke-opacity="0.55">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="3.2s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="253" y="45" width="216" height="4" rx="2" fill="#22D3EE"/>
    <g clip-path="url(#cB)">
      <rect x="-80" y="45" width="70" height="180" fill="url(#sweep)" transform="skewX(-18)">
        <animate attributeName="x" values="-80;320" dur="4.5s" begin="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="361" y="102" font-size="27" text-anchor="middle">🧩</text>
    <text x="361" y="138" font-size="16" font-weight="700" fill="#7DD3FC" text-anchor="middle">Problem Solving</text>
    <text x="361" y="163" font-size="12.5" fill="#B8C7E6" text-anchor="middle">Break • Test</text>
    <text x="361" y="181" font-size="12.5" fill="#B8C7E6" text-anchor="middle">• Iterate</text>
  </g>

  <!-- card 3: Writing -->
  <g>
    <rect x="491" y="45" width="216" height="180" rx="18" fill="url(#cardBg5)" stroke="#A78BFA" stroke-width="1.6" stroke-opacity="0.55">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="491" y="45" width="216" height="4" rx="2" fill="#A78BFA"/>
    <g clip-path="url(#cC)">
      <rect x="-80" y="45" width="70" height="180" fill="url(#sweep)" transform="skewX(-18)">
        <animate attributeName="x" values="-80;320" dur="4.5s" begin="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="599" y="102" font-size="27" text-anchor="middle">📝</text>
    <text x="599" y="138" font-size="16" font-weight="700" fill="#C4B5FD" text-anchor="middle">Writing</text>
    <text x="599" y="163" font-size="12.5" fill="#B8C7E6" text-anchor="middle">Docs people</text>
    <text x="599" y="181" font-size="12.5" fill="#B8C7E6" text-anchor="middle">actually read</text>
  </g>

  <!-- card 4: Collaboration -->
  <g>
    <rect x="729" y="45" width="216" height="180" rx="18" fill="url(#cardBg5)" stroke="#69F0AE" stroke-width="1.6" stroke-opacity="0.55">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="3.2s" begin="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="729" y="45" width="216" height="4" rx="2" fill="#69F0AE"/>
    <g clip-path="url(#cD)">
      <rect x="-80" y="45" width="70" height="180" fill="url(#sweep)" transform="skewX(-18)">
        <animate attributeName="x" values="-80;320" dur="4.5s" begin="3.3s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="837" y="102" font-size="27" text-anchor="middle">🤝</text>
    <text x="837" y="138" font-size="16" font-weight="700" fill="#A7FFC7" text-anchor="middle">Collaboration</text>
    <text x="837" y="163" font-size="12.5" fill="#B8C7E6" text-anchor="middle">Share early</text>
    <text x="837" y="181" font-size="12.5" fill="#B8C7E6" text-anchor="middle">review often</text>
  </g>
</svg>
