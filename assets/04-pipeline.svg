<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" font-family="Segoe UI, Verdana, Arial, sans-serif">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12182B"/>
      <stop offset="100%" stop-color="#0D1424"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B9D"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect x="10" y="22" width="1080" height="186" rx="24" fill="url(#pipeBg)" stroke="#2A3558" stroke-width="2"/>
  <text x="40" y="56" font-size="13" font-weight="700" fill="#7E8FB3" letter-spacing="4">DATA ✦ PIPELINE</text>

  <!-- base connector -->
  <line x1="130" y1="124" x2="970" y2="124" stroke="#2A3558" stroke-width="2.5"/>
  <line x1="130" y1="124" x2="970" y2="124" stroke="url(#pulseGrad)" stroke-width="2.5" stroke-dasharray="90 640" opacity="0.9">
    <animate attributeName="stroke-dashoffset" values="730;0" dur="4.8s" repeatCount="indefinite"/>
  </line>

  <!-- chevrons -->
  <text x="214" y="129" font-size="16" fill="#8B9BC4" text-anchor="middle">›<animate attributeName="opacity" values="0.3;1;0.3" dur="4.8s" begin="0.8s" repeatCount="indefinite"/></text>
  <text x="382" y="129" font-size="16" fill="#8B9BC4" text-anchor="middle">›<animate attributeName="opacity" values="0.3;1;0.3" dur="4.8s" begin="1.6s" repeatCount="indefinite"/></text>
  <text x="550" y="129" font-size="16" fill="#8B9BC4" text-anchor="middle">›<animate attributeName="opacity" values="0.3;1;0.3" dur="4.8s" begin="2.4s" repeatCount="indefinite"/></text>
  <text x="718" y="129" font-size="16" fill="#8B9BC4" text-anchor="middle">›<animate attributeName="opacity" values="0.3;1;0.3" dur="4.8s" begin="3.2s" repeatCount="indefinite"/></text>
  <text x="886" y="129" font-size="16" fill="#8B9BC4" text-anchor="middle">›<animate attributeName="opacity" values="0.3;1;0.3" dur="4.8s" begin="4s" repeatCount="indefinite"/></text>

  <!-- traveling pulse -->
  <circle r="5" fill="#FF6B9D">
    <animateMotion path="M 130 124 L 970 124" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="10" fill="#FF6B9D" opacity="0.3">
    <animateMotion path="M 130 124 L 970 124" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <!-- node 1 -->
  <rect x="75" y="97" width="110" height="54" rx="16" fill="#1A2338" stroke="#FF6B9D" stroke-width="1.6" stroke-opacity="0.35">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="4.8s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <text x="130" y="120" font-size="15" text-anchor="middle">📥</text>
  <text x="130" y="141" font-size="13.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">Collect</text>
  <text x="130" y="172" font-size="11.5" fill="#7E8FB3" text-anchor="middle">✧ gather</text>

  <!-- node 2 -->
  <rect x="243" y="97" width="110" height="54" rx="16" fill="#1A2338" stroke="#22D3EE" stroke-width="1.6" stroke-opacity="0.35">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="4.8s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <text x="298" y="120" font-size="15" text-anchor="middle">✨</text>
  <text x="298" y="141" font-size="13.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">Clean</text>
  <text x="298" y="172" font-size="11.5" fill="#7E8FB3" text-anchor="middle">✧ polish</text>

  <!-- node 3 -->
  <rect x="411" y="97" width="110" height="54" rx="16" fill="#1A2338" stroke="#A78BFA" stroke-width="1.6" stroke-opacity="0.35">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="4.8s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="466" y="120" font-size="15" text-anchor="middle">🔍</text>
  <text x="466" y="141" font-size="13.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">Explore</text>
  <text x="466" y="172" font-size="11.5" fill="#7E8FB3" text-anchor="middle">✧ discover</text>

  <!-- node 4 -->
  <rect x="579" y="97" width="110" height="54" rx="16" fill="#1A2338" stroke="#69F0AE" stroke-width="1.6" stroke-opacity="0.35">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="4.8s" begin="2.4s" repeatCount="indefinite"/>
  </rect>
  <text x="634" y="120" font-size="15" text-anchor="middle">🧠</text>
  <text x="634" y="141" font-size="13.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">Model</text>
  <text x="634" y="172" font-size="11.5" fill="#7E8FB3" text-anchor="middle">✧ train</text>

  <!-- node 5 -->
  <rect x="747" y="97" width="110" height="54" rx="16" fill="#1A2338" stroke="#FFD54F" stroke-width="1.6" stroke-opacity="0.35">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="4.8s" begin="3.2s" repeatCount="indefinite"/>
  </rect>
  <text x="802" y="120" font-size="15" text-anchor="middle">📏</text>
  <text x="802" y="141" font-size="13.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">Evaluate</text>
  <text x="802" y="172" font-size="11.5" fill="#7E8FB3" text-anchor="middle">✧ check</text>

  <!-- node 6 -->
  <rect x="915" y="97" width="110" height="54" rx="16" fill="#1A2338" stroke="#FF6B9D" stroke-width="1.6" stroke-opacity="0.35">
    <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="4.8s" begin="4s" repeatCount="indefinite"/>
  </rect>
  <text x="970" y="120" font-size="15" text-anchor="middle">🚀</text>
  <text x="970" y="141" font-size="13.5" font-weight="700" fill="#E6EDF3" text-anchor="middle">Share</text>
  <text x="970" y="172" font-size="11.5" fill="#7E8FB3" text-anchor="middle">✧ impact</text>

  <text x="1060" y="56" font-size="12" fill="#7E8FB3" text-anchor="end" opacity="0.8">every project rides the same cute journey
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite"/>
  </text>
</svg>
