<svg xmlns="http://www.w3.org/2000/svg" width="960" height="150" viewBox="0 0 960 150" font-family="Segoe UI, Verdana, Arial, sans-serif">
  <!-- floating sparkles -->
  <text x="120" y="36" font-size="13" fill="#FF6B9D" opacity="0.7">✦<animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.4s" repeatCount="indefinite"/></text>
  <text x="420" y="30" font-size="12" fill="#22D3EE" opacity="0.7">✧<animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.8s" begin="0.6s" repeatCount="indefinite"/></text>
  <text x="700" y="36" font-size="13" fill="#A78BFA" opacity="0.7">✦<animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.6s" begin="1.2s" repeatCount="indefinite"/></text>
  <text x="300" y="132" font-size="12" fill="#69F0AE" opacity="0.7">✧<animate attributeName="opacity" values="0.7;0.1;0.7" dur="3s" begin="0.4s" repeatCount="indefinite"/></text>
  <text x="600" y="132" font-size="12" fill="#FFD54F" opacity="0.7">✧<animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.5s" begin="1.6s" repeatCount="indefinite"/></text>

  <!-- chip 1 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="2.8s" repeatCount="indefinite"/>
    <rect x="20" y="52" width="180" height="46" rx="23" fill="#141C31" stroke="#FF6B9D" stroke-width="1.6"/>
    <text x="110" y="81" font-size="14" font-weight="600" fill="#FF9DBB" text-anchor="middle">🤖 Machine Learning</text>
  </g>
  <!-- chip 2 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 6; 0 0" dur="3.2s" begin="0.4s" repeatCount="indefinite"/>
    <rect x="224" y="52" width="190" height="46" rx="23" fill="#141C31" stroke="#22D3EE" stroke-width="1.6"/>
    <text x="319" y="81" font-size="14" font-weight="600" fill="#7DD3FC" text-anchor="middle">📊 Data Analysis</text>
  </g>
  <!-- chip 3 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    <rect x="438" y="52" width="185" height="46" rx="23" fill="#141C31" stroke="#A78BFA" stroke-width="1.6"/>
    <text x="530" y="81" font-size="14" font-weight="600" fill="#C4B5FD" text-anchor="middle">🧩 Clean Pipelines</text>
  </g>
  <!-- chip 4 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 6; 0 0" dur="2.6s" begin="1.2s" repeatCount="indefinite"/>
    <rect x="647" y="52" width="130" height="46" rx="23" fill="#141C31" stroke="#69F0AE" stroke-width="1.6"/>
    <text x="712" y="81" font-size="14" font-weight="600" fill="#A7FFC7" text-anchor="middle">🌸 Cute UI</text>
  </g>
  <!-- chip 5 -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3.4s" begin="1.6s" repeatCount="indefinite"/>
    <rect x="801" y="52" width="140" height="46" rx="23" fill="#141C31" stroke="#FFD54F" stroke-width="1.6"/>
    <text x="871" y="81" font-size="14" font-weight="600" fill="#FFE082" text-anchor="middle">🌱 Learning</text>
  </g>
</svg>
